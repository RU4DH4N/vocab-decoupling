[project]
name = "vocab-decoupling"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "torch==2.12.1",
    "numpy==2.5.1",
    "pyarrow==24.0.0",
    "tokenizers==0.22.2",
]

[project.optional-dependencies]
benchmarks = [
    "transformers==5.14.1",
    "scikit-learn==1.9.0",
    "mauve-text==0.4.0",
    "faiss-cpu==1.15.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.0",
    "pytest==9.1.1",
    "hypothesis==6.167.0",
    "ruff==0.16.6",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["artifacts", "datasets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = [
    "models",
    "data",
    "claims",
    "framework",
    "remote",
    "execution",
    "orchestrator",
    "pipeline",
    "postprocess",
]
exclude = ["artifacts", "datasets"]

[tool.pytest.ini_options]
pythonpath = [".", "unit-tests"]
testpaths = ["unit-tests"]
